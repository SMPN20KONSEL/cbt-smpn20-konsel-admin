<script type="module">

import { db, auth }
from "../assets/js/firebase.js";

import {
  collection,
  getDocs,
  doc,
  getDoc,
  where,
  query
}
from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

import {
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";

// ================= ELEMENT =================
const tbody = document.getElementById("tbody");

// ================= AUTH =================
onAuthStateChanged(auth, async (user) => {

  if(!user){
    location.href = "../login.html";
    return;
  }

  try{

    // cek user
    const userSnap = await getDoc(
      doc(db, "users", user.uid)
    );

    if(!userSnap.exists()){

      alert("User tidak ditemukan");

      location.href = "../login.html";

      return;
    }

    const userData = userSnap.data();

    // cek role
    if(userData.role !== "guru"){

      alert("Akses khusus guru");

      location.href = "../login.html";

      return;
    }

    // load soal guru login
    loadData(user);

  }catch(err){

    console.error(err);

    alert("Gagal autentikasi");

  }

});

// ================= LOAD DATA =================
async function loadData(user){

  try{

    tbody.innerHTML = `
    <tr>
      <td colspan="5" class="loading">
        Memuat data...
      </td>
    </tr>
    `;

    // FILTER BERDASARKAN GURU LOGIN
    const q = query(
      collection(db, "bank_soal"),
      where("guruId", "==", user.uid)
    );

    const snap = await getDocs(q);

    // kosong
    if(snap.empty){

      tbody.innerHTML = `
      <tr>
        <td colspan="5" class="empty">
          Belum ada bank soal
        </td>
      </tr>
      `;

      return;
    }

    let html = "";
    let no = 1;

    snap.forEach((docu) => {

      const d = docu.data();

      html += `
      <tr>

        <td>${no++}</td>

        <td>${d.mapel || "-"}</td>

        <td>${d.judul || "-"}</td>

        <td>${d.namaGuru || "-"}</td>

        <td>

          <button
            class="btn-download"
            data-id="${docu.id}">

            <i class="fa fa-download"></i>
            Unduh

          </button>

        </td>

      </tr>
      `;
    });

    tbody.innerHTML = html;

    // ================= DOWNLOAD =================
    document.querySelectorAll(".btn-download")
    .forEach((btn) => {

      btn.addEventListener("click", async () => {

        try{

          const id = btn.dataset.id;

          // ambil soal
          const soalSnap = await getDoc(
            doc(db, "bank_soal", id)
          );

          if(!soalSnap.exists()){

            alert("Data soal tidak ditemukan");

            return;
          }

          const data = soalSnap.data();

          // ================= ISI FILE =================
          let isi = `
${data.judul || "BANK SOAL"}

Mapel : ${data.mapel || "-"}
Guru  : ${data.namaGuru || "-"}
Kelas : ${data.kelas || "-"}

==================================================

`;

          let nomor = 1;

          // ================= PG =================
          (data.soalPG || []).forEach((s) => {

            isi += `${nomor++}. ${s.pertanyaan}\n`;

            Object.entries(s.opsi || {})
            .forEach(([k,v]) => {

              isi += `${k}. ${v}\n`;

            });

            isi += `Jawaban : ${s.jawabanBenar || "-"}\n\n`;

          });

          // ================= MCMA =================
          (data.soalMCMA || []).forEach((s) => {

            isi += `${nomor++}. ${s.pertanyaan}\n`;

            Object.entries(s.opsi || {})
            .forEach(([k,v]) => {

              isi += `${k}. ${v}\n`;

            });

            isi += `Jawaban : ${(s.jawabanBenar || []).join(", ")}\n\n`;

          });

          // ================= KATEGORI =================
          (data.soalKategori || []).forEach((s) => {

            isi += `${nomor++}. ${s.pertanyaan}\n`;

            (s.pernyataan || [])
            .forEach((p, i) => {

              isi += `${i+1}. ${p.teks} (${p.jawabanBenar ? "Benar" : "Salah"})\n`;

            });

            isi += `\n`;

          });

          // ================= ESSAY =================
          (data.soalEssay || []).forEach((s) => {

            isi += `${nomor++}. ${s.pertanyaan}\n\n`;

          });

          // ================= DOWNLOAD FILE =================
          const blob = new Blob(
            [isi],
            {
              type:"application/msword;charset=utf-8"
            }
          );

          const url = URL.createObjectURL(blob);

          const a = document.createElement("a");

          a.href = url;

          a.download = `${data.judul || "bank-soal"}.doc`;

          document.body.appendChild(a);

          a.click();

          document.body.removeChild(a);

          URL.revokeObjectURL(url);

        }catch(err){

          console.error(err);

          alert("Gagal download file");

        }

      });

    });

  }catch(err){

    console.error(err);

    tbody.innerHTML = `
    <tr>
      <td colspan="5" class="empty">
        Gagal memuat data
      </td>
    </tr>
    `;

  }

}

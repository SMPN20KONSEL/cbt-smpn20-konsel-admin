  <!-- CONTENT -->

    <div class="container">

      </p>

      <div class="table-wrapper">

        <table>

          <thead>

<!-- NAMA GURU -->
<script type="module" src="../assets/js/nama.js"></script>

<!-- ================= SCRIPT ================= -->
<script type="module">

import { db, auth }
from "../assets/js/firebase.js";

import {
  collection,
  getDocs,
  doc,
  getDoc,
  query,
  where
}
from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

import {
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";

// ================= ELEMENT =================
const tbody = document.getElementById("tbody");

// ================= LOAD IMAGE =================
async function loadImage(url){

  const res = await fetch(url);

  if(!res.ok){
    throw new Error("Gagal memuat gambar");
  }

  return await res.arrayBuffer();
}

// ================= FORMAT JUDUL =================
function formatJudul(judul){

  if(!judul) return "BANK SOAL";

  const j = judul.toLowerCase().trim();

  if(
    j.includes("sumatif akhir semester") ||
    j.startsWith("sas")
  ){
    return "SUMATIF AKHIR SEMESTER (SAS)";
  }

  else if(
    j.includes("sumatif tengah semester") ||
    j.startsWith("sts")
  ){
    return "SUMATIF TENGAH SEMESTER (STS)";
  }

  else if(
    j.includes("sumatif harian") ||
    j.startsWith("sh")
  ){
    return "SUMATIF HARIAN (SH)";
  }

  else if(
    j.includes("usbn")
  ){
    return "UJIAN SEKOLAH BERSTANDAR NASIONAL (USBN)";
  }

  return judul.toUpperCase();
}

// ================= AUTH =================
onAuthStateChanged(auth, async(user) => {

  if(!user){

    location.href = "../login.html";
    return;

  }

  loadData(user);

});

// ================= LOAD DATA =================
async function loadData(user){

  try{

    tbody.innerHTML = `
    <tr>
      <td colspan="5" class="loading">
        Memuat data...
      </td>
    </tr>
    `;

    // ================= FILTER GURU LOGIN =================
    const q = query(
      collection(db, "bank_soal"),
      where("guruId", "==", user.uid)
    );

    const snap = await getDocs(q);

    // ================= KOSONG =================
    if(snap.empty){

      tbody.innerHTML = `
      <tr>
        <td colspan="5" class="empty">
          Belum ada bank soal
        </td>
      </tr>
      `;

      return;
    }

    let html = "";
    let no = 1;

    // ================= LOOP =================
    snap.forEach((docu) => {

      const d = docu.data();

      html += `
      <tr>

        <td>${no++}</td>

        <td>${d.mapel || "-"}</td>

        <td>${d.judul || "-"}</td>

        <td>${d.namaGuru || "-"}</td>

        <td>

          <button
            class="btn-download"
            data-id="${docu.id}">

            <i class="fa fa-download"></i>
            Unduh

          </button>

        </td>

      </tr>
      `;
    });

    tbody.innerHTML = html;

    // ================= BUTTON DOWNLOAD =================
    document.querySelectorAll(".btn-download")
    .forEach((btn) => {

      btn.addEventListener("click", async () => {

        try{

          // ================= CEK DOCX =================
          if(!window.docx){

            alert("Library DOCX belum dimuat");
            return;

          }

          // ================= DOCX =================
          const {
            Document,
            Packer,
            Paragraph,
            TextRun,
            AlignmentType,
            Table,
            TableRow,
            TableCell,
            WidthType,
            BorderStyle,
            ImageRun
          } = window.docx;

          // ================= AMBIL DATA =================
          const id = btn.dataset.id;

          const soalSnap = await getDoc(
            doc(db, "bank_soal", id)
          );

          if(!soalSnap.exists()){

            alert("Data soal tidak ditemukan");
            return;

          }

          const data = soalSnap.data();

          // ================= LOAD LOGO =================
          const logoKiri = await loadImage(
            "../assets/img/logo-konawe.png"
          );

          const logoKanan = await loadImage(
            "../assets/img/tutwuri.png"
          );

          // ================= NOMOR =================
          let nomor = 1;

          // ================= CHILDREN =================
          const children = [];

          // ================= HEADER =================
          const kopTable = new Table({

            width:{
              size:100,
              type:WidthType.PERCENTAGE
            },

            borders:{
              top:{style:BorderStyle.NONE,size:0,color:"FFFFFF"},
              bottom:{style:BorderStyle.NONE,size:0,color:"FFFFFF"},
              left:{style:BorderStyle.NONE,size:0,color:"FFFFFF"},
              right:{style:BorderStyle.NONE,size:0,color:"FFFFFF"},
              insideHorizontal:{style:BorderStyle.NONE,size:0,color:"FFFFFF"},
              insideVertical:{style:BorderStyle.NONE,size:0,color:"FFFFFF"}
            },

            rows:[

              new TableRow({

                children:[

                  // ================= LOGO KIRI =================
                  new TableCell({

                    width:{
                      size:15,
                      type:WidthType.PERCENTAGE
                    },

                    borders:{
                      top:{style:BorderStyle.NONE,size:0,color:"FFFFFF"},
                      bottom:{style:BorderStyle.NONE,size:0,color:"FFFFFF"},
                      left:{style:BorderStyle.NONE,size:0,color:"FFFFFF"},
                      right:{style:BorderStyle.NONE,size:0,color:"FFFFFF"}
                    },

                    children:[

                      new Paragraph({

                        alignment:AlignmentType.CENTER,

                        children:[

                          new ImageRun({

                            data:logoKiri,

                            transformation:{
                              width:70,
                              height:70
                            }

                          })

                        ]

                      })

                    ]

                  }),

                  // ================= TENGAH =================
                  new TableCell({

                    width:{
                      size:70,
                      type:WidthType.PERCENTAGE
                    },

                    borders:{
                      top:{style:BorderStyle.NONE,size:0,color:"FFFFFF"},
                      bottom:{style:BorderStyle.NONE,size:0,color:"FFFFFF"},
                      left:{style:BorderStyle.NONE,size:0,color:"FFFFFF"},
                      right:{style:BorderStyle.NONE,size:0,color:"FFFFFF"}
                    },

                    children:[

                      new Paragraph({

                        alignment:AlignmentType.CENTER,

                        spacing:{ after:50 },

                        children:[

                          new TextRun({
                            text:"PEMERINTAH KABUPATEN KONAWE SELATAN",
                            bold:true,
                            size:28
                          })

                        ]

                      }),

                      new Paragraph({

                        alignment:AlignmentType.CENTER,

                        spacing:{ after:50 },

                        children:[

                          new TextRun({
                            text:"DINAS PENDIDIKAN DAN KEBUDAYAAN",
                            bold:true,
                            size:28
                          })

                        ]

                      }),

                      new Paragraph({

                        alignment:AlignmentType.CENTER,

                        spacing:{ after:50 },

                        children:[

                          new TextRun({
                            text:"SMP NEGERI 20 KONAWE SELATAN",
                            bold:true,
                            size:30
                          })

                        ]

                      }),

                      new Paragraph({

                        alignment:AlignmentType.CENTER,

                        children:[

                          new TextRun({
                            text:"Jl. Sabulakoa - Landono Desa Sabulakoa Kec. Sabulakoa",
                            size:22
                          })

                        ]

                      })

                    ]

                  }),

                  // ================= LOGO KANAN =================
                  new TableCell({

                    width:{
                      size:15,
                      type:WidthType.PERCENTAGE
                    },

                    borders:{
                      top:{style:BorderStyle.NONE,size:0,color:"FFFFFF"},
                      bottom:{style:BorderStyle.NONE,size:0,color:"FFFFFF"},
                      left:{style:BorderStyle.NONE,size:0,color:"FFFFFF"},
                      right:{style:BorderStyle.NONE,size:0,color:"FFFFFF"}
                    },

                    children:[

                      new Paragraph({

                        alignment:AlignmentType.CENTER,

                        children:[

                          new ImageRun({

                            data:logoKanan,

                            transformation:{
                              width:70,
                              height:70
                            }

                          })

                        ]

                      })

                    ]

                  })

                ]

              })

            ]

          });

          children.push(kopTable);

          // ================= GARIS =================
          children.push(

            new Paragraph({

              border:{
                bottom:{
                  color:"000000",
                  style:BorderStyle.DOUBLE,
                  size:6
                }
              },

              spacing:{
                after:300
              }

            })

          );

          // ================= JUDUL =================
          children.push(

            new Paragraph({

              alignment:AlignmentType.CENTER,

              spacing:{
                after:300
              },

              children:[

                new TextRun({
                  text: formatJudul(data.judul),
                  bold:true,
                  size:28
                })

              ]

            })

          );

          // ================= IDENTITAS =================
          children.push(

            new Paragraph({
              text:`Mata Pelajaran : ${data.mapel || "-"}`,
              spacing:{ line:360 }
            }),

            new Paragraph({
              text:`Guru           : ${data.namaGuru || "-"}`,
              spacing:{ line:360 }
            }),

            new Paragraph({
              text:`Kelas          : ${data.kelas || "-"}`,
              spacing:{ line:360 }
            }),

            new Paragraph({
              text:"",
              spacing:{ after:200 }
            }),

            // ================= SOAL =================
            new Paragraph({

              alignment:AlignmentType.CENTER,

              spacing:{
                after:100
              },

              children:[

                new TextRun({
                  text:"SOAL - SOAL",
                  bold:true,
                  size:26
                })

              ]

            }),

            // ================= GARIS SOAL =================
            new Paragraph({

              text:"=".repeat(95),

              alignment:AlignmentType.CENTER,

              spacing:{
                after:300
              }

            })

          );

          // ================= PG =================
          (data.soalPG || []).forEach((s) => {

            children.push(

              new Paragraph({

                text:`${nomor++}. ${s.pertanyaan || ""}`,

                spacing:{
                  before:200,
                  line:360
                }

              })

            );

            Object.entries(s.opsi || {})
            .forEach(([k,v]) => {

              children.push(

                new Paragraph({

                  text:`${k}. ${v}`,

                  spacing:{
                    line:360
                  }

                })

              );

            });

            children.push(

              new Paragraph({

                text:`Jawaban : ${s.jawabanBenar || "-"}`,

                spacing:{
                  after:200,
                  line:360
                }

              })

            );

          });

          // ================= MCMA =================
          (data.soalMCMA || []).forEach((s) => {

            children.push(

              new Paragraph({

                text:`${nomor++}. ${s.pertanyaan || ""}`,

                spacing:{
                  before:200,
                  line:360
                }

              })

            );

            Object.entries(s.opsi || {})
            .forEach(([k,v]) => {

              children.push(

                new Paragraph({

                  text:`${k}. ${v}`,

                  spacing:{
                    line:360
                  }

                })

              );

            });

            children.push(

              new Paragraph({

                text:`Jawaban : ${(s.jawabanBenar || []).join(", ")}`,

                spacing:{
                  after:200,
                  line:360
                }

              })

            );

          });

          // ================= KATEGORI =================
          (data.soalKategori || []).forEach((s) => {

            children.push(

              new Paragraph({

                text:`${nomor++}. ${s.pertanyaan || ""}`,

                spacing:{
                  before:200,
                  line:360
                }

              })

            );

            const huruf = ["a","b","c","d","e","f"];

(s.pernyataan || []).forEach((p,i) => {

  children.push(
    new Paragraph({
      text:`${huruf[i]}. ${p.teks} (${p.jawabanBenar ? "Benar" : "Salah"})`,
      spacing:{ line:360 }
    })
  );

});

            children.push(
              new Paragraph({ text:"" })
            );

          });

          // ================= ESSAY =================
          (data.soalEssay || []).forEach((s) => {

            children.push(

              new Paragraph({

                text:`${nomor++}. ${s.pertanyaan || ""}`,

                spacing:{
                  before:200,
                  after:400,
                  line:360
                }

              })

            );

          });

          // ================= DOCUMENT =================
          const docFile = new Document({

            styles:{
              default:{
                document:{
                  run:{
                    font:"Times New Roman",
                    size:24
                  },
                  paragraph:{
                    spacing:{
                      line:360
                    }
                  }
                }
              }
            },

            sections:[

              {

                properties:{
                  page:{
                    margin:{
                      top:700,
                      right:700,
                      bottom:700,
                      left:700
                    }
                  }
                },

                children

              }

            ]

          });

          // ================= EXPORT =================
          const blob = await Packer.toBlob(docFile);

          const url = URL.createObjectURL(blob);

          const a = document.createElement("a");

          a.href = url;

          a.download = `${data.judul || "bank-soal"}.docx`;

          document.body.appendChild(a);

          a.click();

          document.body.removeChild(a);

          URL.revokeObjectURL(url);

        }catch(err){

          console.error(err);

          alert("Gagal download file");
        }

      });

    });

  }catch(err){

    console.error(err);

    tbody.innerHTML = `
    <tr>
      <td colspan="5" class="empty">
        Gagal memuat data
      </td>
    </tr>
    `;
  }

}

// ================= LOAD =================
loadData();

</script>
</body>

<html lang="id">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

/* =====================================================
   CONTENT
===================================================== */
.content{
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:30px;
  gap:20px;
}

/* =====================================================
   JUDUL
===================================================== */
.page-title{
  width:100%;
  max-width:1100px;

  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:10px;
}

.page-title h1{
  font-size:28px;
  color:#0f172a;
}

/* =====================================================
   BUTTON REFRESH
===================================================== */
.refresh-btn{
  border:none;
  background:#2563eb;
  color:white;

  padding:12px 18px;

  border-radius:10px;

  cursor:pointer;

  font-size:14px;
  font-weight:600;

  transition:.2s;
}

.refresh-btn:hover{
  background:#1d4ed8;
}

/* =====================================================
   STATISTIK
===================================================== */
.stats{
  width:100%;
  max-width:1100px;

  display:grid;
  grid-template-columns:
  repeat(auto-fit,minmax(180px,1fr));

  gap:15px;
}

.stat-card{
  background:white;

  border-radius:14px;

  padding:20px;

  box-shadow:
  0 3px 10px rgba(0,0,0,.08);

  display:flex;
  align-items:center;
  gap:15px;

  transition:.2s;
}

.stat-card:hover{
  transform:translateY(-3px);
}

.stat-icon{
  width:55px;
  height:55px;

  border-radius:12px;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:24px;
  color:white;
}

.bg-online{
  background:#f59e0b;
}

.bg-ujian{
  background:#2563eb;
}

.bg-selesai{
  background:#16a34a;
}

.stat-info h2{
  margin:0;
  font-size:26px;
  color:#111827;
}

.stat-info p{
  margin:0;
  color:#64748b;
  font-size:14px;
}

/* =====================================================
   FILTER
===================================================== */
.toolbar{
  width:100%;
  max-width:1100px;

  display:flex;
  gap:15px;
  flex-wrap:wrap;

  justify-content:space-between;
  align-items:center;
}

.search-box{
  flex:1;
  min-width:250px;
  position:relative;
}

.search-box input{
  width:100%;

  padding:
  12px 15px 12px 45px;

  border-radius:10px;

  border:1px solid #d1d5db;

  outline:none;

  font-size:14px;
}

.search-box i{
  position:absolute;

  left:15px;
  top:50%;

  transform:translateY(-50%);

  color:#64748b;
}

.filter-select{
  padding:12px;

  border-radius:10px;

  border:1px solid #d1d5db;

  outline:none;
}

/* =====================================================
   TABLE
===================================================== */
.table-wrap{
  width:100%;
  max-width:1100px;

  overflow-x:auto;
}

table{
  width:100%;

  border-collapse:collapse;

  background:white;

  border-radius:14px;

  overflow:hidden;

  box-shadow:
  0 2px 10px rgba(0,0,0,.08);
}

th{
  background:#0b48ac;
  color:white;

  font-size:14px;
}

th,td{
  padding:12px;

  border-bottom:
  1px solid #e5e7eb;

  text-align:center;

  font-size:14px;
}

tr:hover{
  background:#f8fafc;
}

table td:nth-child(2),
table th:nth-child(2){
  text-align:left;
}

table td:nth-child(2){
  font-weight:600;
}

/* =====================================================
   STATUS
===================================================== */
.online{
  color:#f59e0b;
  font-weight:bold;
}

.kerja{
  color:#2563eb;
  font-weight:bold;
}

.selesai{
  color:#16a34a;
  font-weight:bold;
}

/* =====================================================
   BUTTON
===================================================== */
.btn{
  padding:8px 12px;

  border:none;

  border-radius:8px;

  background:#2563eb;

  color:white;

  cursor:pointer;

  font-size:13px;

  transition:.2s;
}

.btn:hover{
  background:#1d4ed8;
}

/* =====================================================
   LIVE DOT
===================================================== */
.live-dot{
  width:10px;
  height:10px;

  border-radius:50%;

  background:#22c55e;

  display:inline-block;

  margin-right:6px;

  animation:pulse 1s infinite;
}

@keyframes pulse{

  0%{
    transform:scale(1);
    opacity:1;
  }

  50%{
    transform:scale(1.4);
    opacity:.5;
  }

  100%{
    transform:scale(1);
    opacity:1;
  }

}

/* =====================================================
   RESPONSIVE
===================================================== */
@media(max-width:768px){

  .content{
    padding:15px;
  }

  th,td{
    font-size:12px;
    padding:10px;
  }

  .page-title h1{
    font-size:22px;
  }

}

</style>
</head>
<body>

  </div>

</header>

<div class="dashboard">

<!-- ================= SIDEBAR ================= -->
<aside class="sidebar">

  <h2>
    <i class="fas fa-user-shield"></i>

  </h2>

  <ul class="menu">

    <li>
      <a href="dashboard.html">
        <i class="fa fa-home"></i>

      </a>
    </li>

    <li>

        <i class="fa fa-users"></i>

    </li>

    <li>
      <a href="guru.html">

    </li>

    <li>

    </li>

    </li>

<!-- ================= CONTENT ================= -->
<div class="content">

  <!-- ================= TITLE ================= -->
  <div class="page-title">

    <h1>
      <span class="live-dot"></span>
      Monitoring Siswa Ujian
    </h1>

    <button
      class="refresh-btn"
      onclick="loadPeserta()"
    >
      <i class="fa fa-rotate-right"></i>
      Refresh
    </button>

  </div>

  <!-- ================= STATISTIK ================= -->
  <div class="stats">

    <div class="stat-card">

      <div class="stat-icon bg-online">
        <i class="fa fa-user"></i>
      </div>

      <div class="stat-info">
        <h2 id="jmlOnline">0</h2>
        <p>Login</p>
      </div>

    </div>

    <div class="stat-card">

      <div class="stat-icon bg-ujian">
        <i class="fa fa-pen"></i>
      </div>

      <div class="stat-info">
        <h2 id="jmlUjian">0</h2>
        <p>Mengerjakan</p>
      </div>

    </div>

    <div class="stat-card">

      <div class="stat-icon bg-selesai">
        <i class="fa fa-check"></i>
      </div>

      <div class="stat-info">
        <h2 id="jmlSelesai">0</h2>
        <p>Selesai</p>
      </div>

    </div>

  </div>

  <!-- ================= TOOLBAR ================= -->
  <div class="toolbar">

    <div class="search-box">

      <i class="fa fa-search"></i>

      <input
        type="text"
        id="searchInput"
        placeholder="Cari nama siswa..."
      >

    </div>

    <select
      id="filterKelas"
      class="filter-select"
    >

  </div>

  <!-- ================= TABLE ================= -->
  <div class="table-wrap">

    <table>

      <thead>

        <tr>

          <th>No</th>

          <th>Email</th>
          <th>Kelas</th>
          <th>Kode Ujian</th>
          <th>Status</th>
          <th>Login</th>
          <th>Aksi</th>

        </tr>

      </thead>

      <tbody id="table-body"></tbody>

    </table>

  </div>

<!-- ================= SCRIPT ================= -->
<script type="module">

import { db }
from "../assets/js/firebase.js";

import {
  collection,
  getDocs
}
from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

/* ===============================
   ELEMENT
=============================== */
const tableBody =
document.getElementById("table-body");

const searchInput =
document.getElementById("searchInput");

const filterKelas =
document.getElementById("filterKelas");

const jmlOnline =
document.getElementById("jmlOnline");

const jmlUjian =
document.getElementById("jmlUjian");

const jmlSelesai =
document.getElementById("jmlSelesai");

/* ===============================
   GLOBAL
=============================== */
let semuaData = [];

/* ===============================
   LOAD PESERTA
=============================== */
async function loadPeserta(){

  tableBody.innerHTML = `
    <tr>
      <td colspan="8">
        Memuat data...
      </td>
    </tr>
  `;

  try{

    const snap =
    await getDocs(
      collection(db,"peserta")
    );

    semuaData = [];

    const kelasSet =
    new Set();

    snap.forEach((docSnap)=>{

      const data = {
        id:docSnap.id,
        ...docSnap.data()
      };

      // tampilkan hanya data penting
      if(
        data.status === "login" ||
        data.status === "mengerjakan" ||
        data.status === "selesai"
      ){

        semuaData.push(data);

        if(data.kelas){
          kelasSet.add(data.kelas);
        }

      }

    });

    // SORT
    semuaData.sort((a,b)=>{

      const urutan = {

        mengerjakan : 1,
        login       : 2,
        selesai     : 3

      };

      return (
        (urutan[a.status] || 4)
        -
        (urutan[b.status] || 4)
      );

    });

    // FILTER KELAS
    filterKelas.innerHTML =
    `
      <option value="">
        Semua Kelas
      </option>
    `;

    [...kelasSet]
    .sort()
    .forEach((kelas)=>{

      filterKelas.innerHTML += `
        <option value="${kelas}">
          ${kelas}
        </option>
      `;

    });

    renderTable(semuaData);

  }catch(err){

    console.error(err);

    tableBody.innerHTML = `
      <tr>
        <td colspan="8">
          Gagal memuat data
        </td>
      </tr>
    `;

  }

}

/* ===============================
   RENDER TABLE
=============================== */
function renderTable(dataList){

  tableBody.innerHTML = "";

  let no = 1;

  let totalLogin = 0;
  let totalUjian = 0;
  let totalSelesai = 0;

  dataList.forEach((data)=>{

    let statusText = "";
    let statusClass = "";

    // LOGIN
    if(data.status === "login"){

      statusText =
      "🟡 Login";

      statusClass =
      "online";

      totalLogin++;

    }

    // MENGERJAKAN
    if(data.status === "mengerjakan"){

      statusText =
      "🔵 Mengerjakan";

      statusClass =
      "kerja";

      totalUjian++;

    }

    // SELESAI
    if(data.status === "selesai"){

      statusText =
      "🟢 Selesai";

      statusClass =
      "selesai";

      totalSelesai++;

    }

    tableBody.innerHTML += `

      <tr>

        <td>${no++}</td>

        <td>
          ${data.nama || "-"}
        </td>

        <td>
          ${data.email || "-"}
        </td>

        <td>
          ${data.kelas || "-"}
        </td>

        <td>
          ${data.kodeUjian || "-"}
        </td>

        <td class="${statusClass}">
          ${statusText}
        </td>

        <td>

          ${
            data.loginAt?.toDate
            ? data.loginAt
              .toDate()
              .toLocaleTimeString("id-ID")
            : "-"
          }

        </td>

        <td>

          <button
            class="btn"
            onclick="
              location.href=
              'detail-siswa.html?id=${data.id}'
            "
          >
            Lihat
          </button>

        </td>

      </tr>

    `;

  });

  // STATISTIK
  jmlOnline.textContent =
  totalLogin;

  jmlUjian.textContent =
  totalUjian;

  jmlSelesai.textContent =
  totalSelesai;

}

/* ===============================
   FILTER
=============================== */
function filterData(){

  const keyword =
  searchInput.value
  .toLowerCase();

  const kelas =
  filterKelas.value;

  const hasil =
  semuaData.filter((data)=>{

    const cocokNama =
    (data.nama || "")
    .toLowerCase()
    .includes(keyword);

    const cocokKelas =
    kelas === ""
    || data.kelas === kelas;

    return cocokNama && cocokKelas;

  });

  renderTable(hasil);

}

/* ===============================
   EVENT
=============================== */
searchInput.addEventListener(
  "input",
  filterData
);

filterKelas.addEventListener(
  "change",
  filterData
);

/* ===============================
   GLOBAL BUTTON
=============================== */
window.loadPeserta =
loadPeserta;

/* ===============================
   LOAD AWAL
=============================== */
loadPeserta();

</script>

<script type="module">

import { db }
from "../assets/js/firebase.js";

import {
  collection,
  getDocs,
  doc,
  getDoc
}
from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

const tbody = document.getElementById("tbody");

/* ================= LOAD IMAGE ================= */
async function loadImage(url){

  const res = await fetch(url);

  if(!res.ok){
    throw new Error("Gagal memuat gambar");
  }

  return await res.arrayBuffer();
}

/* ================= FORMAT JUDUL ================= */
function formatJudul(judul){

  if(!judul) return "BANK SOAL";

  const j = judul.toLowerCase().trim();

  if(
    j.includes("sumatif akhir semester") ||
    j.startsWith("sas")
  ){
    return "SUMATIF AKHIR SEMESTER (SAS)";
  }

  else if(
    j.includes("sumatif tengah semester") ||
    j.startsWith("sts")
  ){
    return "SUMATIF TENGAH SEMESTER (STS)";
  }

  else if(
    j.includes("sumatif harian") ||
    j.startsWith("sh")
  ){
    return "SUMATIF HARIAN (SH)";
  }

  else if(j.includes("usbn")){
    return "UJIAN SEKOLAH BERSTANDAR NASIONAL (USBN)";
  }

  return judul.toUpperCase();
}

/* ================= LOAD DATA ================= */
async function loadData(){

  try{

    const snap = await getDocs(
      collection(db, "bank_soal")
    );

    if(snap.empty){

      tbody.innerHTML = `
      <tr>
        <td colspan="5" class="empty">
          Tidak ada data soal
        </td>
      </tr>
      `;

      return;
    }

    let html = "";
    let no = 1;

    snap.forEach((docu) => {

      const d = docu.data();

      html += `
      <tr>

        <td>${no++}</td>

        <td>${d.mapel || "-"}</td>

        <td>${d.judul || "-"}</td>

        <td>${d.namaGuru || "-"}</td>

        <td>

          <div class="download-box">

            <label class="switch-label">

              <input 
                type="checkbox"
                id="kunci-${docu.id}"
                checked
              >

              <span>Dengan Jawaban</span>

            </label>

            <button
              class="btn-download"
              data-id="${docu.id}">

              <i class="fa fa-download"></i>
              Unduh

            </button>

          </div>

        </td>

      </tr>
      `;
    });

    tbody.innerHTML = html;

    /* ================= BUTTON DOWNLOAD ================= */
    document.querySelectorAll(".btn-download")
    .forEach((btn) => {

      btn.addEventListener("click", async () => {

        try{

          if(!window.docx){
            alert("Library DOCX belum siap");
            return;
          }

          const {
            Document,
            Packer,
            Paragraph,
            TextRun,
            AlignmentType,
            Table,
            TableRow,
            TableCell,
            WidthType,
            BorderStyle,
            ImageRun
          } = window.docx;

          const id = btn.dataset.id;

          const soalSnap = await getDoc(
            doc(db, "bank_soal", id)
          );

          if(!soalSnap.exists()){

            alert("Data tidak ditemukan");
            return;

          }

          const data = soalSnap.data();

          const pakaiKunci = document.getElementById(
            `kunci-${id}`
          )?.checked;

          const logoKiri = await loadImage(
            "../assets/img/logo-konawe.png"
          );

          const logoKanan = await loadImage(
            "../assets/img/tutwuri.png"
          );

          const children = [];

          /* ================= HEADER ================= */

          const kopTable = new Table({

            width:{
              size:100,
              type:WidthType.PERCENTAGE
            },

            borders:{
              top:{style:BorderStyle.NONE,size:0,color:"FFFFFF"},
              bottom:{style:BorderStyle.NONE,size:0,color:"FFFFFF"},
              left:{style:BorderStyle.NONE,size:0,color:"FFFFFF"},
              right:{style:BorderStyle.NONE,size:0,color:"FFFFFF"},
              insideHorizontal:{style:BorderStyle.NONE,size:0,color:"FFFFFF"},
              insideVertical:{style:BorderStyle.NONE,size:0,color:"FFFFFF"}
            },

            rows:[

              new TableRow({

                children:[

                  /* LOGO KIRI */
                  new TableCell({

                    width:{
                      size:15,
                      type:WidthType.PERCENTAGE
                    },

                    borders:{
                      top:{style:BorderStyle.NONE,size:0,color:"FFFFFF"},
                      bottom:{style:BorderStyle.NONE,size:0,color:"FFFFFF"},
                      left:{style:BorderStyle.NONE,size:0,color:"FFFFFF"},
                      right:{style:BorderStyle.NONE,size:0,color:"FFFFFF"}
                    },

                    children:[

                      new Paragraph({

                        alignment:AlignmentType.CENTER,

                        children:[

                          new ImageRun({

                            data:logoKiri,

                            transformation:{
                              width:70,
                              height:70
                            }

                          })

                        ]

                      })

                    ]

                  }),

                  /* TENGAH */
                  new TableCell({

                    width:{
                      size:70,
                      type:WidthType.PERCENTAGE
                    },

                    borders:{
                      top:{style:BorderStyle.NONE,size:0,color:"FFFFFF"},
                      bottom:{style:BorderStyle.NONE,size:0,color:"FFFFFF"},
                      left:{style:BorderStyle.NONE,size:0,color:"FFFFFF"},
                      right:{style:BorderStyle.NONE,size:0,color:"FFFFFF"}
                    },

                    children:[

                      new Paragraph({

                        alignment:AlignmentType.CENTER,

                        children:[

                          new TextRun({
                            text:"PEMERINTAH KABUPATEN KONAWE SELATAN",
                            bold:true,
                            size:24
                          })

                        ]

                      }),

                      new Paragraph({

                        alignment:AlignmentType.CENTER,

                        children:[

                          new TextRun({
                            text:"SMP NEGERI 20 KONAWE SELATAN",
                            bold:true,
                            size:30
                          })

                        ]

                      }),

                      new Paragraph({

                        alignment:AlignmentType.CENTER,

                        children:[

                          new TextRun({
                            text:"CBT APPLICATION",
                            size:20
                          })

                        ]

                      })

                    ]

                  }),

                  /* LOGO KANAN */
                  new TableCell({

                    width:{
                      size:15,
                      type:WidthType.PERCENTAGE
                    },

                    borders:{
                      top:{style:BorderStyle.NONE,size:0,color:"FFFFFF"},
                      bottom:{style:BorderStyle.NONE,size:0,color:"FFFFFF"},
                      left:{style:BorderStyle.NONE,size:0,color:"FFFFFF"},
                      right:{style:BorderStyle.NONE,size:0,color:"FFFFFF"}
                    },

                    children:[

                      new Paragraph({

                        alignment:AlignmentType.CENTER,

                        children:[

                          new ImageRun({

                            data:logoKanan,

                            transformation:{
                              width:70,
                              height:70
                            }

                          })

                        ]

                      })

                    ]

                  })

                ]

              })

            ]

          });

          children.push(kopTable);

          /* ================= GARIS ================= */

          children.push(

            new Paragraph({

              border:{
                bottom:{
                  color:"000000",
                  style:BorderStyle.DOUBLE,
                  size:6
                }
              },

              spacing:{
                after:300
              }

            })

          );

          /* ================= JUDUL ================= */

          children.push(

            new Paragraph({

              alignment:AlignmentType.CENTER,

              spacing:{
                after:300
              },

              children:[

                new TextRun({
                  text:formatJudul(data.judul),
                  bold:true,
                  size:28
                })

              ]

            })

          );

          /* ================= INFO ================= */

          children.push(

            new Paragraph({
              text:`Mata Pelajaran : ${data.mapel || "-"}`,
              spacing:{ line:360 }
            }),

            new Paragraph({
              text:`Guru : ${data.namaGuru || "-"}`,
              spacing:{ line:360 }
            }),

            new Paragraph({
              text:`Kelas : ${data.kelas || "-"}`,
              spacing:{ line:360 }
            }),

            new Paragraph({
              text:""
            })

          );

          /* ================= PG ================= */

          (data.soalPG || []).forEach((s) => {

            children.push(

              new Paragraph({

                numbering:{
                  reference:"soal-numbering",
                  level:0
                },

                spacing:{
                  before:200,
                  after:100,
                  line:360
                },

                children:[

                  new TextRun({
                    text:s.pertanyaan || "",
                    size:24
                  })

                ]

              })

            );

            const urutanOpsi = ["A","B","C","D","E"];

            urutanOpsi.forEach((huruf) => {

              if(s.opsi?.[huruf]){

                children.push(

                  new Paragraph({

                    indent:{
                      left:700
                    },

                    spacing:{
                      line:320
                    },

                    children:[

                      new TextRun({
                        text:`${huruf}. ${s.opsi[huruf]}`,
                        size:24
                      })

                    ]

                  })

                );

              }

            });

            if(pakaiKunci){

              children.push(

                new Paragraph({

                  indent:{
                    left:700
                  },

                  spacing:{
                    after:250,
                    line:320
                  },

                  children:[

                    new TextRun({
                      text:`Jawaban : ${s.jawabanBenar || "-"}`,
                      bold:true,
                      size:24
                    })

                  ]

                })

              );

            }

          });

          /* ================= MCMA ================= */

          (data.soalMCMA || []).forEach((s) => {

            children.push(

              new Paragraph({

                numbering:{
                  reference:"soal-numbering",
                  level:0
                },

                spacing:{
                  before:200,
                  after:100,
                  line:360
                },

                children:[

                  new TextRun({
                    text:s.pertanyaan || "",
                    size:24
                  })

                ]

              })

            );

            const urutanOpsi = ["A","B","C","D","E"];

            urutanOpsi.forEach((huruf) => {

              if(s.opsi?.[huruf]){

                children.push(

                  new Paragraph({

                    indent:{
                      left:700
                    },

                    spacing:{
                      line:320
                    },

                    children:[

                      new TextRun({
                        text:`${huruf}. ${s.opsi[huruf]}`,
                        size:24
                      })

                    ]

                  })

                );

              }

            });

            if(pakaiKunci){

              children.push(

                new Paragraph({

                  indent:{
                    left:700
                  },

                  spacing:{
                    after:250,
                    line:320
                  },

                  children:[

                    new TextRun({
                      text:`Jawaban : ${(s.jawabanBenar || []).join(", ")}`,
                      bold:true,
                      size:24
                    })

                  ]

                })

              );

            }

          });
/* ================= KATEGORI ================= */
(data.soalKategori || []).forEach((s) => {

  // ================= SOAL =================
  children.push(

    new Paragraph({

      numbering:{
        reference:"soal-numbering",
        level:0
      },

      spacing:{
        before:200,
        after:120,
        line:360
      },

      children:[

        new TextRun({
          text:s.pertanyaan || "",
          size:24
        })

      ]

    })

  );

  // ================= HURUF KECIL =================
  const huruf = ["a","b","c","d","e","f"];

  // ================= PERNYATAAN =================
  (s.pernyataan || []).forEach((p,i) => {

    children.push(

      new Paragraph({

        indent:{
          left:700
        },

        spacing:{
          line:360
        },

        children:[

          new TextRun({
            text:`${huruf[i]}. ${p.teks || ""}`,
            size:24
          })

        ]

      })

    );

  });

  // ================= JAWABAN =================
  if(pakaiKunci){

    const jawabanKategori = [];

    (s.pernyataan || []).forEach((p,i) => {

      jawabanKategori.push(
        `${huruf[i]} = ${p.jawabanBenar ? "Benar" : "Salah"}`
      );

    });

    children.push(

      new Paragraph({

        indent:{
          left:700
        },

        spacing:{
          after:250,
          line:360
        },

        children:[

          new TextRun({
            text:`Jawaban : ${jawabanKategori.join(", ")}`,
            bold:true,
            size:24
          })

        ]

      })

    );

  }

});
/* ================= ESSAY ================= */

          (data.soalEssay || []).forEach((s) => {

            children.push(

              new Paragraph({

                numbering:{
                  reference:"soal-numbering",
                  level:0
                },

                spacing:{
                  before:250,
                  after:400,
                  line:360
                },

                children:[

                  new TextRun({
                    text:s.pertanyaan || "",
                    size:24
                  })

                ]

              })

            );

          });

          /* ================= DOCUMENT ================= */

          const docFile = new Document({

            numbering:{
              config:[
                {
                  reference:"soal-numbering",

                  levels:[
                    {
                      level:0,
                      format:"decimal",
                      text:"%1.",
                      alignment:AlignmentType.START,

                      style:{
                        paragraph:{
                          indent:{
                            left:500,
                            hanging:300
                          }
                        }
                      }

                    }
                  ]
                }
              ]
            },

            sections:[

              {

                properties:{
                  page:{
                    margin:{
                      top:700,
                      right:700,
                      bottom:700,
                      left:700
                    }
                  }
                },

                children

              }

            ]

          });

          const blob = await Packer.toBlob(docFile);

          const url = URL.createObjectURL(blob);

          const a = document.createElement("a");

          a.href = url;

          const namaMapel = (data.mapel || "Mapel")
          .replace(/[\\/:*?"<>|]/g, "")
          .trim();

          const namaJudul = (data.judul || "Bank Soal")
          .replace(/[\\/:*?"<>|]/g, "")
          .trim();

          a.download = `${namaMapel} ${namaJudul}.docx`;

          document.body.appendChild(a);

          a.click();

          document.body.removeChild(a);

          URL.revokeObjectURL(url);

        }catch(err){

          console.error(err);

          alert("Gagal download");

        }

      });

    });

  }catch(err){

    console.error(err);

    tbody.innerHTML = `
    <tr>
      <td colspan="5" class="empty">
        Gagal memuat data
      </td>
    </tr>
    `;
  }

}

loadData();

</script>
